app.security.crypto-key=12345678901234567890123456789012

app.security.cors-allowed-origins=http://localhost:4200

app.redis.host=localhost
app.redis.port=6379
app.redis.username=
app.redis.password=

flowkirim.api-token=test-token
flowkirim.device-id=test-device

spring.mail.username=test@example.com
spring.mail.password=test-password