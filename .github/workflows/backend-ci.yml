name: Backend CI/CD

on:
  push:
    branches:
      - development

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pinjam100_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pinjam100_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APPLICATION_NAME: bagas.pinjam100

      DB_URL: jdbc:postgresql://localhost:5432/pinjam100_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: loan

      # Test-only schema generation.
      # Do not use this setting in production.
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: loan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready \
            --host localhost \
            --port 5432 \
            --username postgres \
            --dbname pinjam100_test; do
            sleep 2
          done

      - name: Initialize test database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host localhost \
            --port 5432 \
            --username postgres \
            --dbname pinjam100_test \
            --command 'CREATE SCHEMA IF NOT EXISTS loan;'

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw --batch-mode clean verify

      - name: Build Docker image
        run: docker build -t api-pinjam100:ci .