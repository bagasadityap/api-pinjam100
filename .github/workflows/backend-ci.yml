name: Backend CI/CD

on:
  push:
    branches:
      - development

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pinjam100_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pinjam100_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # Menambahkan service Redis untuk pengujian jika dibutuhkan
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APPLICATION_NAME: bagas.pinjam100

      # PostgreSQL khusus CI
      DB_URL: jdbc:postgresql://localhost:5432/pinjam100_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: loan

      # Redis khusus CI
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

      # Test secrets
      JWT_SECRET: ci-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DEMO_PASSWORD: ci-demo-password
      CRYPTO_KEY: ci-test-crypto-key-0123456789-abcdefghijklmnopqrstuvwxyz
      FLOWKIRIM_API_TOKEN: ci-test-token
      FLOWKIRIM_DEVICE_ID: ci-test-device
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: ci-test-password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Initialize PostgreSQL schema
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host localhost \
            --port 5432 \
            --username postgres \
            --dbname pinjam100_test \
            --command "CREATE SCHEMA IF NOT EXISTS loan;"

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: loan
        run: ./mvnw clean verify

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/api-pinjam100:development \
            .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/api-pinjam100:development

  deploy:
    name: Deploy to VPS
    needs: build-and-test
    runs-on: ubuntu-24.04

    environment: deployment

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FLOWKIRIM_BASE_URL: ${{ secrets.FLOWKIRIM_BASE_URL }}
          FLOWKIRIM_API_TOKEN: ${{ secrets.FLOWKIRIM_API_TOKEN }}
          FLOWKIRIM_DEVICE_ID: ${{ secrets.FLOWKIRIM_DEVICE_ID }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }} # Personal Access Token untuk docker login di VPS
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}

          envs: >-
            POSTGRES_PASSWORD,
            JWT_SECRET,
            FLOWKIRIM_BASE_URL,
            FLOWKIRIM_API_TOKEN,
            FLOWKIRIM_DEVICE_ID,
            MAIL_USERNAME,
            MAIL_PASSWORD,
            FIREBASE_CREDENTIALS,
            GHCR_PAT

          script: |
            set -e

            echo "======================================"
            echo "Deploying Pinjam100 Stack via Docker Compose"
            echo "======================================"

            CD_PATH="/opt/pinjam100"
            mkdir -p $CD_PATH/secrets
            cd $CD_PATH

            echo "Writing Firebase credentials..."
            echo "$FIREBASE_CREDENTIALS" > ./secrets/firebase-credentials.json

            echo "Writing .env file..."
            cat <<EOF > .env
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SECRET=$JWT_SECRET
            FLOWKIRIM_BASE_URL=$FLOWKIRIM_BASE_URL
            FLOWKIRIM_API_TOKEN=$FLOWKIRIM_API_TOKEN
            FLOWKIRIM_DEVICE_ID=$FLOWKIRIM_DEVICE_ID
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            EOF

            echo "Logging in to GHCR..."
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "Pulling latest image and updating containers..."
            docker compose pull api
            docker compose up -d --remove-orphans

            echo "======================================"
            echo "Container Status"
            echo "======================================"
            docker compose ps

            echo "======================================"
            echo "Application Logs"
            echo "======================================"
            docker compose logs --tail=50 api