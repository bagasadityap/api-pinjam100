name: Backend CI

env:
  APPLICATION_NAME: bagas.pinjam100

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t api-pinjam100:ci .