services:
  api:
    # Ganti blok 'build:' dengan 'image:' seperti di bawah ini:
    image: ghcr.io/bagasadityap/api-pinjam100:development
    container_name: api-pinjam100
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pinjam100
      SPRING_DATASOURCE_USERNAME: pinjam100
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-credentials.json

      FLOWKIRIM_BASE_URL: ${FLOWKIRIM_BASE_URL}
      FLOWKIRIM_API_TOKEN: ${FLOWKIRIM_API_TOKEN}
      FLOWKIRIM_DEVICE_ID: ${FLOWKIRIM_DEVICE_ID}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    volumes:
      - ./secrets/firebase-credentials.json:/app/secrets/firebase-credentials.json:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: api-pinjam100-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pinjam100
      POSTGRES_USER: pinjam100
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinjam100 -d pinjam100"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: api-pinjam100-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: